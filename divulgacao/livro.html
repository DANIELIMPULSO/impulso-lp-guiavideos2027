<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Livro do guia · imagem para e-mail</title>
<!-- Gera o livro em 3D com fundo transparente (capturar com fundo omitido em 1040×760). -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../lp.css">
<style>
  html, body { margin: 0; background: transparent !important; overflow: hidden; }
  .palco { width: 1040px; height: 760px; display: grid; place-items: center; }
  .book { --w: 420px; --d: 50px; margin: 0; }
  .book::after { display: none; }
  .book-3d { --ry: -24deg; --rx: 5deg; }
  .cover { padding: 34px 30px 30px 40px; }
  .cover-tag { font-size: 15px; }
  .cover-year { font-size: 140px; }
  .cover-title { font-size: 38px; }
  .cover-foot { font-size: 13px; }
</style>
</head>
<body>
<div class="palco">
  <span class="book">
    <span class="book-3d">
      <span class="cover foto"><img class="cover-img" src="../capa-guia.jpg" alt=""></span>
      <span class="book-pages"></span>
      <span class="book-top"></span>
      <span class="book-spine"><span>Planejamento audiovisual 2027</span></span>
      <span class="book-back"></span>
    </span>
    <span class="book-shadow"></span>
  </span>
</div>
</body>
</html>
