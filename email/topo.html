<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Topo do e-mail · Guia 2027</title>
<!-- Gera a imagem do topo do e-mail (livro + título em Anton), 512 px de largura, capturada em 2x. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css">
<style>
  html, body { margin: 0; background: #383838; }
  .topo { width: 512px; padding: 6px 0 4px; display: grid; justify-items: center; gap: 22px; background: #383838; }
  .topo img { width: 234px; display: block; }
  .topo h1 { justify-self: stretch; margin: 0; font: 400 40px/1.08 var(--display); text-transform: uppercase; color: var(--text); }
  .topo h1 span { display: block; color: var(--yellow); }
</style>
</head>
<body>
<div class="topo" id="topo">
  <img src="livro-email.jpg" alt="">
  <h1>Seu guia chegou.<span>Decida antes de ligar a câmera.</span></h1>
</div>
</body>
</html>
